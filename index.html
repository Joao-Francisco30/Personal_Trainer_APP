<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1d2a2a;--mute:#6b7877;--line:#dde2e0;--accent:#0f6b63;--accent-ink:#fff;--warn:#b4432c}
@media(prefers-color-scheme:dark){:root{--bg:#141a1a;--card:#1c2424;--ink:#e8eeec;--mute:#92a19f;--line:#2b3636;--accent:#3fb3a6;--accent-ink:#0b1514;--warn:#e27d65}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
nav b{padding:0 10px 14px;font-size:17px}
nav button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;color:var(--ink);font:inherit;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-ink)}
nav .out{margin-top:auto;color:var(--mute)}
main{padding:28px 32px;max-width:1000px}
h1{font-size:24px;margin:0 0 18px}h2{font-size:17px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}label input,label textarea{margin-top:4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
button.p,button.s{font:inherit;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent)}
button.p{background:var(--accent);color:var(--accent-ink)}button.s{background:none;color:var(--accent)}
button.d{background:none;border:0;color:var(--warn);cursor:pointer;font:inherit}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.dot{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grid img,.grid video{width:100%;height:200px;object-fit:cover;border-radius:6px;background:var(--line)}
.mute{color:var(--mute)}.err{color:var(--warn)}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--line)}main{padding:18px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// 1. Paste your own values from Supabase: Project Settings > API
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString() : '';
const state = { view: 'clients', client: null, tab: 'overview' };

async function init() {
  const { data: { session } } = await db.auth.getSession();
  session ? shell() : loginView();
}

function loginView(msg = '') {
  root.innerHTML = `<div class="login"><h1>PT Dashboard</h1><div class="card">
    <label>Email<input id="em" type="email" autocomplete="username"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err">${esc(msg)}</p><button class="p" id="go">Sign in</button></div></div>`;
  $('#go').onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    error ? loginView('Sign-in failed. Check your email and password.') : shell();
  };
}

function shell() {
  root.innerHTML = `<div class="app"><nav><b>PT Dashboard</b>
    <button data-v="clients">Clients</button><button data-v="templates">Templates</button><button data-v="exercises">Exercises</button><button data-v="faq">FAQ</button><button data-v="videos">Video links</button>
    <button class="out" id="out">Sign out</button></nav><main id="main"></main></div>`;
  document.querySelectorAll('nav [data-v]').forEach(b => b.onclick = () => { state.view = b.dataset.v; state.client = null; render(); });
  $('#out').onclick = async () => { await db.auth.signOut(); loginView(); };
  render();
}

function render() {
  document.querySelectorAll('nav [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  if (state.view === 'clients') return state.client ? clientView() : clientsView();
  if (state.view === 'templates') return templatesView();
  if (state.view === 'exercises') return listEditor('exercises', 'Exercise library', [['name', 'Name'], ['muscle_group', 'Muscle group'], ['video_url', 'Demo video URL (optional)'], ['notes', 'Technique notes', 'area']], 'name');
  if (state.view === 'faq') return listEditor('faq', 'FAQ', [['question', 'Question'], ['answer', 'Answer', 'area']]);
  if (state.view === 'videos') return listEditor('video_links', 'Video links', [['title', 'Title'], ['url', 'YouTube URL'], ['description', 'Why it is useful', 'area']]);
}

async function clientsView() {
  const m = $('#main'); m.innerHTML = '<h1>Clients</h1><p class="mute">Loading…</p>';
  const [{ data: cl }, { data: un }] = await Promise.all([
    db.from('clients').select('*').order('name'),
    db.from('media_uploads').select('client_id').eq('seen_by_pt', false)]);
  const unseen = {}; (un || []).forEach(u => unseen[u.client_id] = (unseen[u.client_id] || 0) + 1);
  m.innerHTML = `<h1>Clients</h1><div class="card"><table><tr><th>Name</th><th>Goal</th><th>Started</th><th></th></tr>
    ${(cl || []).map(c => `<tr class="click" data-id="${c.id}"><td>${esc(c.name)}${c.active ? '' : ' <span class="mute">(archived)</span>'}${unseen[c.id] ? `<span class="dot">${unseen[c.id]} new</span>` : ''}</td><td>${esc(c.goal)}</td><td>${fmt(c.start_date)}</td><td></td></tr>`).join('') || '<tr><td colspan="4" class="mute">No clients yet. Add your first one below.</td></tr>'}
    </table></div>
    <h2>Add client</h2><div class="card"><div class="row"><label>Name<input id="n"></label><label>Email<input id="e"></label><label>Phone<input id="ph"></label></div>
    <label>Goal<input id="g"></label><button class="p" id="add">Add client</button></div>`;
  m.querySelectorAll('tr.click').forEach(r => r.onclick = () => { state.client = (cl || []).find(c => c.id === r.dataset.id); state.tab = 'overview'; render(); });
  $('#add').onclick = async () => {
    if (!$('#n').value.trim()) return;
    await db.from('clients').insert({ name: $('#n').value, email: $('#e').value, phone: $('#ph').value, goal: $('#g').value });
    clientsView();
  };
}

function clientView() {
  const c = state.client, m = $('#main');
  const tabs = [['overview', 'Overview'], ['workouts', 'Workouts'], ['meals', 'Meals'], ['measurements', 'Measurements'], ['uploads', 'Photos & videos']];
  m.innerHTML = `<button class="s" id="back">Back to clients</button><h1 style="margin-top:14px">${esc(c.name)}</h1>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${state.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div id="tab"></div>`;
  $('#back').onclick = () => { state.client = null; render(); };
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.tab = b.dataset.t; clientView(); });
  ({ overview: overviewTab, workouts: workoutsTab, meals: mealsTab, measurements: measTab, uploads: uploadsTab })[state.tab](c, $('#tab'));
}

function overviewTab(c, el) {
  el.innerHTML = `<div class="card"><div class="row"><label>Name<input id="n" value="${esc(c.name)}"></label><label>Email<input id="e" value="${esc(c.email)}"></label><label>Phone<input id="ph" value="${esc(c.phone)}"></label></div>
    <label>Goal<input id="g" value="${esc(c.goal)}"></label><label>Private notes<textarea id="no" rows="4">${esc(c.notes)}</textarea></label>
    <label><input type="checkbox" id="ac" style="width:auto" ${c.active ? 'checked' : ''}> Active client</label>
    <button class="p" id="save">Save changes</button> <span id="ok" class="mute"></span></div>`;
  $('#save').onclick = async () => {
    const u = { name: $('#n').value, email: $('#e').value, phone: $('#ph').value, goal: $('#g').value, notes: $('#no').value, active: $('#ac').checked };
    const { error } = await db.from('clients').update(u).eq('id', c.id);
    if (!error) Object.assign(c, u);
    $('#ok').textContent = error ? 'Could not save.' : 'Saved.';
  };
}

const MF = [['weight_kg', 'Weight (kg)'], ['waist_cm', 'Waist'], ['hips_cm', 'Hips'], ['chest_cm', 'Chest'], ['arm_cm', 'Arm'], ['thigh_cm', 'Thigh']];
async function measTab(c, el) {
  const { data } = await db.from('measurements').select('*').eq('client_id', c.id).order('measured_on', { ascending: false });
  el.innerHTML = `<div class="card" style="overflow-x:auto"><table><tr><th>Date</th>${MF.map(f => `<th>${f[1]}</th>`).join('')}</tr>
    ${(data || []).map(r => `<tr><td>${fmt(r.measured_on)}</td>${MF.map(f => `<td>${r[f[0]] ?? ''}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="7" class="mute">No measurements yet. The client will add them from the phone app, or you can add one below.</td></tr>'}</table></div>
    <h2>Add measurement</h2><div class="card"><div class="row"><label>Date<input type="date" id="d" value="${new Date().toISOString().slice(0, 10)}"></label>
    ${MF.map(f => `<label>${f[1]}<input type="number" step="0.1" id="m_${f[0]}"></label>`).join('')}</div><button class="p" id="add">Add measurement</button></div>`;
  $('#add').onclick = async () => {
    const row = { client_id: c.id, measured_on: $('#d').value };
    MF.forEach(f => { const v = $('#m_' + f[0]).value; if (v) row[f[0]] = +v; });
    await db.from('measurements').insert(row); measTab(c, el);
  };
}

async function uploadsTab(c, el) {
  const { data } = await db.from('media_uploads').select('*').eq('client_id', c.id).order('created_at', { ascending: false });
  if (!data?.length) { el.innerHTML = '<p class="mute">No photos or videos yet. Uploads from this client will appear here.</p>'; return; }
  const items = await Promise.all(data.map(async u => ({ ...u, url: (await db.storage.from('client-media').createSignedUrl(u.file_path, 3600)).data?.signedUrl })));
  el.innerHTML = `<div class="grid">${items.map(u => `<div class="card">${u.kind === 'video' ? `<video src="${u.url}" controls></video>` : `<a href="${u.url}" target="_blank"><img src="${u.url}" alt=""></a>`}
    <div class="mute">${fmt(u.created_at)}${u.seen_by_pt ? '' : ' · new'}</div><div>${esc(u.note)}</div></div>`).join('')}</div>`;
  await db.from('media_uploads').update({ seen_by_pt: true }).eq('client_id', c.id).eq('seen_by_pt', false);
}

async function listEditor(table, title, fields, order = 'position') {
  const m = $('#main'); m.innerHTML = `<h1>${title}</h1><p class="mute">Loading…</p>`;
  const { data } = await db.from(table).select('*').order(order);
  const input = (f, v = '') => `<label>${f[1]}${f[2] === 'area' ? `<textarea rows="3" data-f="${f[0]}">${esc(v)}</textarea>` : `<input data-f="${f[0]}" value="${esc(v)}">`}</label>`;
  m.innerHTML = `<h1>${title}</h1>
    ${(data || []).map(r => `<div class="card" data-id="${r.id}">${fields.map(f => input(f, r[f[0]])).join('')}<button class="p sv">Save changes</button> <button class="d rm">Delete</button></div>`).join('') || '<p class="mute">Nothing here yet. Add the first entry below.</p>'}
    <h2>Add new</h2><div class="card" id="new">${fields.map(f => input(f)).join('')}<button class="p" id="add">Add</button></div>`;
  const read = el => Object.fromEntries([...el.querySelectorAll('[data-f]')].map(i => [i.dataset.f, i.value]));
  m.querySelectorAll('.sv').forEach(b => b.onclick = async () => { const c = b.closest('.card'); await db.from(table).update(read(c)).eq('id', c.dataset.id); b.textContent = 'Saved'; });
  m.querySelectorAll('.rm').forEach(b => b.onclick = async () => { if (confirm('Delete this entry?')) { await db.from(table).delete().eq('id', b.closest('.card').dataset.id); listEditor(table, title, fields, order); } });
  $('#add').onclick = async () => { const r = read($('#new')); if (!r[fields[0][0]].trim()) return; if (order === 'position') r.position = data?.length || 0; await db.from(table).insert(r); listEditor(table, title, fields, order); };
}

async function workoutsTab(c, el) {
  const [{ data }, { data: tpl }] = await Promise.all([
    db.from('workout_plans').select('*').eq('client_id', c.id).order('created_at', { ascending: false }),
    db.from('workout_plans').select('id,title').eq('is_template', true).order('title')]);
  el.innerHTML = `<div class="card"><table><tr><th>Plan</th><th>Created</th></tr>
    ${(data || []).map(p => `<tr class="click" data-id="${p.id}"><td>${esc(p.title)}</td><td>${fmt(p.created_at)}</td></tr>`).join('') || '<tr><td colspan="2" class="mute">No workout plans yet. Create the first one below.</td></tr>'}</table></div>
    <h2>Assign from template</h2><div class="card">${tpl?.length ? `<label>Template<select id="tp">${tpl.map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><button class="p" id="asg">Assign a copy to ${esc(c.name)}</button>` : '<span class="mute">No templates yet. Create one on the Templates page.</span>'}</div>
    <h2>New workout plan</h2><div class="card"><label>Title<input id="pt" placeholder="Strength block, weeks 1-4"></label><button class="p" id="add">Create plan</button></div>`;
  el.querySelectorAll('tr.click').forEach(r => r.onclick = () => planEditor(c, el, r.dataset.id));
  if ($('#asg')) $('#asg').onclick = async () => {
    const { data: nid, error } = await db.rpc('copy_workout_plan', { p_source: $('#tp').value, p_client: c.id, p_template: false });
    error ? alert('Could not assign: ' + error.message) : planEditor(c, el, nid);
  };
  $('#add').onclick = async () => {
    const t = $('#pt').value.trim(); if (!t) return;
    const { data: p } = await db.from('workout_plans').insert({ client_id: c.id, title: t }).select().single();
    planEditor(c, el, p.id);
  };
}

async function planEditor(c, el, planId) {
  const [{ data: plan }, { data: days }, { data: ex }] = await Promise.all([
    db.from('workout_plans').select('*').eq('id', planId).single(),
    db.from('workout_days').select('*, workout_items(*)').eq('plan_id', planId).order('position'),
    db.from('exercises').select('id,name').order('name')]);
  const exName = Object.fromEntries((ex || []).map(e => [e.id, e.name]));
  const opts = (ex || []).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('');
  const again = () => planEditor(c, el, planId);
  el.innerHTML = `<button class="s" id="pb">Back</button> ${plan.is_template ? '' : '<button class="s" id="st">Save as template</button>'} <button class="d" id="pd">Delete plan</button>
    <h2>${plan.is_template ? 'Template: ' : ''}${esc(plan.title)}</h2>${ex?.length ? '' : '<p class="err">Add exercises in the Exercises page first, then come back.</p>'}
    ${(days || []).map(d => { const its = (d.workout_items || []).sort((a, b) => a.position - b.position); return `<div class="card" data-day="${d.id}">
      <b>${esc(d.name)}</b> <button class="d dd">Delete day</button>
      <table><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Rest (s)</th><th>Notes</th><th></th></tr>
      ${its.map(i => `<tr><td>${esc(exName[i.exercise_id])}</td><td>${i.sets ?? ''}</td><td>${esc(i.reps)}</td><td>${i.rest_seconds ?? ''}</td><td>${esc(i.notes)}</td><td><button class="d di" data-i="${i.id}">Remove</button></td></tr>`).join('')}</table>
      <div class="row" style="margin-top:12px"><label>Exercise<select class="x">${opts}</select></label><label>Sets<input class="s1" type="number"></label><label>Reps<input class="r1" placeholder="8-12"></label><label>Rest (s)<input class="t1" type="number"></label><label>Notes<input class="n1"></label></div>
      <button class="p ai" data-n="${its.length}">Add exercise</button></div>`; }).join('') || '<p class="mute">No days yet. Add the first one below, for example Day A.</p>'}
    <div class="card"><label>New day name<input id="dn" placeholder="Day A: upper body"></label><button class="p" id="ad">Add day</button></div>`;
  const back = () => c ? workoutsTab(c, el) : templatesView();
  $('#pb').onclick = back;
  $('#pd').onclick = async () => { if (confirm('Delete this whole plan?')) { await db.from('workout_plans').delete().eq('id', planId); back(); } };
  if ($('#st')) $('#st').onclick = async () => {
    const t = prompt('Template name:', plan.title); if (!t) return;
    const { error } = await db.rpc('copy_workout_plan', { p_source: planId, p_client: null, p_template: true, p_title: t });
    alert(error ? 'Could not save: ' + error.message : 'Saved. Find it on the Templates page.');
  };
  $('#ad').onclick = async () => { const n = $('#dn').value.trim(); if (!n) return; await db.from('workout_days').insert({ plan_id: planId, name: n, position: days.length }); again(); };
  el.querySelectorAll('.dd').forEach(b => b.onclick = async () => { if (confirm('Delete this day?')) { await db.from('workout_days').delete().eq('id', b.closest('.card').dataset.day); again(); } });
  el.querySelectorAll('.di').forEach(b => b.onclick = async () => { await db.from('workout_items').delete().eq('id', b.dataset.i); again(); });
  el.querySelectorAll('.ai').forEach(b => b.onclick = async () => {
    const k = b.closest('.card'), q = s => k.querySelector(s).value; if (!q('.x')) return;
    await db.from('workout_items').insert({ day_id: k.dataset.day, exercise_id: q('.x'), sets: q('.s1') || null, reps: q('.r1'), rest_seconds: q('.t1') || null, notes: q('.n1'), position: +b.dataset.n });
    again();
  });
}

async function mealsTab(c, el) {
  const [{ data }, { data: tpl }] = await Promise.all([
    db.from('meal_plans').select('*').eq('client_id', c.id).order('created_at', { ascending: false }),
    db.from('meal_plans').select('id,title').eq('is_template', true).order('title')]);
  el.innerHTML = `<div class="card"><table><tr><th>Plan</th><th>Created</th></tr>
    ${(data || []).map(p => `<tr class="click" data-id="${p.id}"><td>${esc(p.title)}</td><td>${fmt(p.created_at)}</td></tr>`).join('') || '<tr><td colspan="2" class="mute">No meal plans yet. Create the first one below.</td></tr>'}</table></div>
    <h2>Assign from template</h2><div class="card">${tpl?.length ? `<label>Template<select id="tp">${tpl.map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><button class="p" id="asg">Assign a copy to ${esc(c.name)}</button>` : '<span class="mute">No meal templates yet. Create one on the Templates page.</span>'}</div>
    <h2>New meal plan</h2><div class="card"><label>Title<input id="pt" placeholder="Cutting diet, 2000 kcal"></label><button class="p" id="add">Create plan</button></div>`;
  el.querySelectorAll('tr.click').forEach(r => r.onclick = () => mealEditor(c, el, r.dataset.id));
  if ($('#asg')) $('#asg').onclick = async () => {
    const { data: nid, error } = await db.rpc('copy_meal_plan', { p_source: $('#tp').value, p_client: c.id, p_template: false });
    error ? alert('Could not assign: ' + error.message) : mealEditor(c, el, nid);
  };
  $('#add').onclick = async () => {
    const t = $('#pt').value.trim(); if (!t) return;
    const { data: p } = await db.from('meal_plans').insert({ client_id: c.id, title: t }).select().single();
    mealEditor(c, el, p.id);
  };
}

async function mealEditor(c, el, planId) {
  const [{ data: plan }, { data: meals }] = await Promise.all([
    db.from('meal_plans').select('*').eq('id', planId).single(),
    db.from('meals').select('*, meal_items(*)').eq('plan_id', planId).order('position')]);
  const again = () => mealEditor(c, el, planId);
  const num = v => v === '' ? null : +v;
  const mac = m => [m.calories != null && m.calories + ' kcal', m.protein_g != null && m.protein_g + 'g protein', m.carbs_g != null && m.carbs_g + 'g carbs', m.fat_g != null && m.fat_g + 'g fat'].filter(Boolean).join(' · ');
  el.innerHTML = `<button class="s" id="pb">Back</button> ${plan.is_template ? '' : '<button class="s" id="st">Save as template</button>'} <button class="d" id="pd">Delete plan</button>
    <h2>${plan.is_template ? 'Template: ' : ''}${esc(plan.title)}</h2>
    ${(meals || []).map(m => { const its = (m.meal_items || []).sort((a, b) => a.position - b.position); return `<div class="card" data-meal="${m.id}">
      <b>${esc(m.name)}</b> <span class="mute">${esc(m.time_of_day)} ${mac(m)}</span> <button class="d dm">Delete meal</button>
      <table><tr><th>Food</th><th>Quantity</th><th>Notes</th><th></th></tr>
      ${its.map(i => `<tr><td>${esc(i.food)}</td><td>${esc(i.quantity)}</td><td>${esc(i.notes)}</td><td><button class="d dfi" data-i="${i.id}">Remove</button></td></tr>`).join('')}</table>
      <div class="row" style="margin-top:12px"><label>Food<input class="f1"></label><label>Quantity<input class="q1" placeholder="150 g"></label><label>Notes<input class="n1"></label></div>
      <button class="p af" data-n="${its.length}">Add food</button></div>`; }).join('') || '<p class="mute">No meals yet. Add the first one below, for example Breakfast.</p>'}
    <h2>Add meal</h2><div class="card"><div class="row"><label>Name<input id="mn" placeholder="Breakfast"></label><label>Time<input id="mt" placeholder="08:00"></label><label>Calories<input id="mk" type="number"></label><label>Protein (g)<input id="mp" type="number"></label><label>Carbs (g)<input id="mc" type="number"></label><label>Fat (g)<input id="mf" type="number"></label></div>
    <button class="p" id="am">Add meal</button></div>`;
  const back = () => c ? mealsTab(c, el) : templatesView();
  $('#pb').onclick = back;
  $('#pd').onclick = async () => { if (confirm('Delete this whole plan?')) { await db.from('meal_plans').delete().eq('id', planId); back(); } };
  if ($('#st')) $('#st').onclick = async () => {
    const t = prompt('Template name:', plan.title); if (!t) return;
    const { error } = await db.rpc('copy_meal_plan', { p_source: planId, p_client: null, p_template: true, p_title: t });
    alert(error ? 'Could not save: ' + error.message : 'Saved. Find it on the Templates page.');
  };
  $('#am').onclick = async () => {
    const n = $('#mn').value.trim(); if (!n) return;
    await db.from('meals').insert({ plan_id: planId, name: n, time_of_day: $('#mt').value, calories: num($('#mk').value), protein_g: num($('#mp').value), carbs_g: num($('#mc').value), fat_g: num($('#mf').value), position: meals.length });
    again();
  };
  el.querySelectorAll('.dm').forEach(b => b.onclick = async () => { if (confirm('Delete this meal?')) { await db.from('meals').delete().eq('id', b.closest('.card').dataset.meal); again(); } });
  el.querySelectorAll('.dfi').forEach(b => b.onclick = async () => { await db.from('meal_items').delete().eq('id', b.dataset.i); again(); });
  el.querySelectorAll('.af').forEach(b => b.onclick = async () => {
    const k = b.closest('.card'), q = x => k.querySelector(x).value; if (!q('.f1').trim()) return;
    await db.from('meal_items').insert({ meal_id: k.dataset.meal, food: q('.f1'), quantity: q('.q1'), notes: q('.n1'), position: +b.dataset.n });
    again();
  });
}

async function templatesView() {
  const m = $('#main');
  const [{ data: w }, { data: ml }] = await Promise.all([
    db.from('workout_plans').select('*').eq('is_template', true).order('title'),
    db.from('meal_plans').select('*').eq('is_template', true).order('title')]);
  const tbl = (rows, k) => `<div class="card"><table><tr><th>Name</th><th>Created</th></tr>${(rows || []).map(p => `<tr class="click" data-k="${k}" data-id="${p.id}"><td>${esc(p.title)}</td><td>${fmt(p.created_at)}</td></tr>`).join('') || '<tr><td colspan="2" class="mute">No templates yet.</td></tr>'}</table></div>`;
  m.innerHTML = `<h1>Templates</h1><h2>Workout templates</h2>${tbl(w, 'w')}
    <div class="card"><label>New workout template<input id="tt" placeholder="Full body, 3 days"></label><button class="p" id="add">Create workout template</button></div>
    <h2>Meal plan templates</h2>${tbl(ml, 'm')}
    <div class="card"><label>New meal plan template<input id="tm" placeholder="Maintenance, 2500 kcal"></label><button class="p" id="addm">Create meal template</button></div>`;
  m.querySelectorAll('tr.click').forEach(r => r.onclick = () => (r.dataset.k === 'w' ? planEditor : mealEditor)(null, m, r.dataset.id));
  const mk = (btn, input, table, editor) => $(btn).onclick = async () => {
    const t = $(input).value.trim(); if (!t) return;
    const { data: p } = await db.from(table).insert({ title: t, is_template: true }).select().single();
    editor(null, m, p.id);
  };
  mk('#add', '#tt', 'workout_plans', planEditor); mk('#addm', '#tm', 'meal_plans', mealEditor);
}

init();
</script>
</body>
</html>
